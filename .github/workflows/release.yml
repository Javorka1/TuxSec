name: Build Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build lowlatd release binary and portable bundle
        run: |
          chmod +x install-linux.sh packaging/build-release-bundle.sh packaging/install.sh
          ./packaging/build-release-bundle.sh

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: parsec-linux-host-x86_64
          path: dist/parsec-linux-host-x86_64.tar.gz

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/parsec-linux-host-x86_64.tar.gz
